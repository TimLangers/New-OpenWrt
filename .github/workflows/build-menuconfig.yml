name: 编译 OpenWrt 最新版固件

on:
  workflow_dispatch:
  repository_dispatch:
  schedule:
    - cron: '0 16 * * *'

env:
  REPO_URL: https://github.com/openwrt/openwrt
  REPO_BRANCH: main
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: 1. 拉取当前源码仓库
      uses: actions/checkout@v4

    - name: 准备编译时间标记
      run: |
        echo "FILE_DATE=$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_ENV

    - name: 2. 清理磁盘并安装依赖
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/*
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/share/swift
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file qemu-utils upx-ucl fastjar libelf-dev swig python3-setuptools python3-pyelftools zstd jq libssl-dev libcap-dev binutils-dev
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$USER /workdir

    - name: 2.1 创建 6GB Swap
      run: |
        sudo swapoff -a || true
        sudo rm -f /swapfile || true
        sudo fallocate -l 6G /swapfile
        sudo chmod 600 /swapfile
        sudo mkswap /swapfile
        sudo swapon /swapfile

    - name: 3. 收集服务器信息
      run: |
        echo "CPU: $(cat /proc/cpuinfo | grep name | cut -f2 -d: | uniq)"
        echo "核心数: $(nproc)"
        free -h
        df -h

    - name: 4. 拉取 OpenWrt 主线源码
      working-directory: /workdir
      run: |
        git clone --depth 1 -b $REPO_BRANCH $REPO_URL openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: ⚡ 启用编译缓存
      uses: actions/cache@v4
      with:
        path: |
          openwrt/dl
          openwrt/staging_dir/host
          openwrt/build_dir/host
        key: ${{ runner.os }}-openwrt-main-${{ hashFiles('openwrt/feeds.conf.default', 'openwrt/.config') }}
        restore-keys: |
          ${{ runner.os }}-openwrt-main-

    - name: 5. 执行 diy-part1.sh
      run: |
        [ -e $FEEDS_CONF ] && cp $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: 6. 更新并安装 Feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: 7. 执行 diy-part2.sh 并加载配置
      run: |
        [ -e $CONFIG_FILE ] && cp $CONFIG_FILE openwrt/.config
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: 8. 下载编译依赖
      run: |
        cd openwrt
        make defconfig
        make download -j16 V=s || make download -j8 V=s

    - name: 9. 开始编译固件
      run: |
        cd openwrt
        make -j$(nproc) || make -j1 V=s

    - name: 10. 整理固件
      run: |
        mkdir -p $GITHUB_WORKSPACE/firmware
        find openwrt/bin/targets/ -type f \( -name "*.img.gz" -o -name "*.vmdk" -o -name "*.qcow2" -o -name "*.manifest" \) -exec cp {} $GITHUB_WORKSPACE/firmware/ \;
        echo "FIRMWARE=$GITHUB_WORKSPACE/firmware" >> $GITHUB_ENV

    # ==================== Telegram 通知 ====================
    - name: 11. Telegram 编译通知
      uses: appleboy/telegram-action@v1.0.0
      if: always()
      with:
        to: ${{ secrets.TELEGRAM_CHAT_ID }}
        token: ${{ secrets.TELEGRAM_TOKEN }}
        message: |
          🚀 *OpenWrt 编译通知*

          *状态*：${{ job.status == 'success' && '✅ 编译成功' || '❌ 编译失败' }}
          *时间*：${{ env.FILE_DATE }}
          *分支*：main

          ${{ job.status == 'success' && '🎉 固件已打包完成！' || '⚠️ 请查看 Actions 日志排查错误' }}
        disable_web_page_preview: true

    - name: 12. 上传 Artifact
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: OpenWrt_Latest_${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    - name: 13. 发布 GitHub Release
      uses: softprops/action-gh-release@v2
      if: success()
      with:
        tag_name: OpenWrt_Latest_${{ env.FILE_DATE }}
        name: OpenWrt 最新版 [${{ env.FILE_DATE }}]
        body: |
          ### OpenWrt Main 最新编译版
          - sing-box 1.13.5（Tailscale 已修复）
          - Argon 最新主题
          - 默认 IP：10.1.1.1/24
        files: ${{ env.FIRMWARE }}/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
