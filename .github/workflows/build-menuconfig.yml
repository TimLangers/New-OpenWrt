name: 编译 OpenWrt 最新版固件

on:
  workflow_dispatch:
  repository_dispatch:
  schedule:
    - cron: '0 16 * * *'

env:
  REPO_URL: https://github.com/openwrt/openwrt
  REPO_BRANCH: main
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: 1. 拉取当前源码仓库
      uses: actions/checkout@v4

    # -----------------------------------------------------------------
    - name: 准备编译时间标记
      run: |
        echo "FILE_DATE=$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_ENV

    # -----------------------------------------------------------------
    - name: 2. 清理磁盘并安装依赖
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/*
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /usr/local/share/powershell
        sudo rm -rf /usr/share/swift

        sudo -E apt-get -qq update

        sudo -E apt-get -qq install -y \
          build-essential clang flex bison g++ gawk gcc-multilib \
          g++-multilib gettext git libncurses-dev libssl-dev \
          python3-distutils rsync unzip zlib1g-dev file qemu-utils \
          upx-ucl fastjar libelf-dev swig python3-setuptools \
          python3-pyelftools zstd jq libcap-dev binutils-dev

        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean

        sudo timedatectl set-timezone "$TZ"

        sudo mkdir -p /workdir
        sudo chown $USER:$USER /workdir

    # -----------------------------------------------------------------
    - name: 2.1 创建 6GB Swap
      run: |
        sudo swapoff -a || true
        sudo rm -f /swapfile || true

        sudo fallocate -l 6G /swapfile
        sudo chmod 600 /swapfile
        sudo mkswap /swapfile
        sudo swapon /swapfile

    # -----------------------------------------------------------------
    - name: 3. 收集服务器信息
      run: |
        echo "CPU: $(cat /proc/cpuinfo | grep name | cut -f2 -d: | uniq)"
        echo "核心数: $(nproc)"

        free -h
        df -h

    # -----------------------------------------------------------------
    - name: 4. 拉取 OpenWrt 主线源码
      working-directory: /workdir
      run: |
        git clone --depth 1 -b $REPO_BRANCH $REPO_URL openwrt

        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    # -----------------------------------------------------------------
    - name: ⚡ 启用编译缓存
      uses: actions/cache@v4
      with:
        path: |
          openwrt/dl
        key: ${{ runner.os }}-openwrt-main-${{ hashFiles('openwrt/.config') }}
        restore-keys: |
          ${{ runner.os }}-openwrt-main-

    # -----------------------------------------------------------------
    - name: 5. 执行 diy-part1.sh
      run: |
        [ -e $FEEDS_CONF ] && cp $FEEDS_CONF openwrt/feeds.conf.default

        chmod +x $DIY_P1_SH

        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    # -----------------------------------------------------------------
    - name: 6. 更新并安装 Feeds
      run: |
        cd openwrt

        ./scripts/feeds update -a
        ./scripts/feeds install -a

    # -----------------------------------------------------------------
    - name: 6.1 修复第三方 Golang 路径
      run: |
        cd openwrt

        find package -name Makefile | xargs sed -i \
        's#../../lang/golang/#$(TOPDIR)/feeds/packages/lang/golang/#g'

    # -----------------------------------------------------------------
    - name: 7. 执行 diy-part2.sh 并加载配置
      run: |
        [ -e $CONFIG_FILE ] && cp $CONFIG_FILE openwrt/.config

        chmod +x $DIY_P2_SH

        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    # -----------------------------------------------------------------
    - name: 8. 下载编译依赖
      run: |
        cd openwrt

        make defconfig

        make download -j16 V=s || make download -j8 V=s

    # -----------------------------------------------------------------
    - name: 9. 开始编译固件
      run: |
        cd openwrt

        make -j2 || make -j1 V=s

    # -----------------------------------------------------------------
    - name: 10. 整理固件
      run: |
        mkdir -p $GITHUB_WORKSPACE/firmware

        find openwrt/bin/targets/ -type f \
        \( -name "*.img.gz" -o -name "*.vmdk" -o -name "*.qcow2" -o -name "*.manifest" \) \
        -exec cp {} $GITHUB_WORKSPACE/firmware/ \;

        echo "FIRMWARE=$GITHUB_WORKSPACE/firmware" >> $GITHUB_ENV

    # -----------------------------------------------------------------
    - name: 11. 上传固件至 Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: OpenWrt_firmware_${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    # -----------------------------------------------------------------
    - name: 12. 发布到 GitHub Releases
      uses: softprops/action-gh-release@v2
      if: success()
      with:
        tag_name: OpenWrt_${{ env.FILE_DATE }}
        files: ${{ env.FIRMWARE }}/*
        body: |
          🚀 OpenWrt Main 固件自动发布
          📅 编译时间: ${{ env.FILE_DATE }}
          🌿 编译分支: main
          🔥 集成插件: sing-box, Argon, Tailscale 等
          🌐 默认 IP: 10.1.1.1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # -----------------------------------------------------------------
    - name: 13. 发送 Telegram 通知
      uses: appleboy/telegram-action@master
      if: always()
      with:
        to: ${{ secrets.TELEGRAM_TO }}
        token: ${{ secrets.TELEGRAM_TOKEN }}
        message: |
          ┏━━━━━━━━━━━━━━━━━━━━━━┓
          ┃    🚀 OpenWrt 自动编译通知 🚀    ┃
          ┗━━━━━━━━━━━━━━━━━━━━━━┛

          🕒 编译时间：${{ env.FILE_DATE }}
          🌿 编译分支：main
          🖥️ 平台环境：GitHub Actions
          ⚙️ 固件源码：OpenWrt Main

          ━━━━━━━━━━━━━━━━━━━━━━
          ${{ job.status == 'success' && '
          ✅ 编译状态：编译成功

          🎉 固件已成功生成
          📦 Artifact 已上传
          🚀 Release 已自动发布

          🔥 当前集成：
          • sing-box 1.13.5
          • Argon 最新主题
          • Tailscale 修复版
          • 默认 IP：10.1.1.1

          💾 可前往 GitHub Releases 下载固件
          ' || '
          ❌ 编译状态：编译失败

          ⚠️ 编译过程中出现错误
          🛠️ 请检查 GitHub Actions 日志

          🔍 常见原因：
          • 第三方插件冲突
          • feeds 更新异常
          • 网络下载失败
          • 内存不足/OOM
          ' }}
          ━━━━━━━━━━━━━━━━━━━━━━

          🤖 自动化构建系统
          ❤️ Powered By GitHub Actions
