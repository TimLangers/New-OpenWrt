name: 编译 OpenWrt 最新版固件

on:
  repository_dispatch:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/openwrt/openwrt
  REPO_BRANCH: main                 # 使用最新的主分支 main
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    # ---------------------------------------------------------
    # 【步骤 1】拉取当前仓库代码
    # ---------------------------------------------------------
    - name: 1. 拉取当前源码仓库
      uses: actions/checkout@v4

    # ---------------------------------------------------------
    # 【生成时间变量】注入系统环境变量中
    # ---------------------------------------------------------
    - name: 准备编译时间标记
      run: |
        echo "FILE_DATE=$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_ENV

    # ---------------------------------------------------------
    # 【⚡ 加速优化：深度清理】剔除虚拟机无用大型垃圾，释放磁盘 I/O 吞吐
    # ---------------------------------------------------------
    - name: 2. 清理磁盘空间并安装 Linux 编译必备依赖
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/*
        # 彻底蒸发 30GB+ 没用的开发工具垃圾，让磁盘读写大幅提速
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/share/swift
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file qemu-utils upx-ucl fastjar libelf-dev swig python3-setuptools python3-pyelftools zstd jq libssl-dev libcap-dev binutils-dev
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$USER /workdir

    # ---------------------------------------------------------
    # 【步骤 3】获取服务器硬件信息
    # ---------------------------------------------------------
    - name: 3. 收集编译服务器配置信息
      run: |
        echo "========= 💻 服务器 CPU 信息 ========="
        cat /proc/cpuinfo | grep name | cut -f2 -d: | uniq
        echo "核心数: $(nproc)"
        echo "========= 🧠 服务器内存信息 ========="
        free -h
        echo "========= 💽 服务器磁盘空间 ========="
        df -h
        echo "========= 🌐 服务器网络环境 ========="
        curl -s https://ipinfo.io/json || true

    # ---------------------------------------------------------
    # 【步骤 4】下载核心源码 (浅克隆加速)
    # ---------------------------------------------------------
    - name: 4. 拷贝 OpenWrt 最新主分支源码
      working-directory: /workdir
      run: |
        git clone --depth 1 -b $REPO_BRANCH $REPO_URL openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    # ---------------------------------------------------------
    # 【⚡ 加速优化：智能缓存】接管并存储编译依赖与工具链，第二次编译直接秒杀
    # ---------------------------------------------------------
    - name: ⚡ 开启 GitHub 官方智能编译缓存 (Cache)
      uses: actions/cache@v4
      with:
        path: |
          openwrt/dl
          openwrt/staging_dir/host
          openwrt/build_dir/host
        key: ${{ runner.os }}-openwrt-main-${{ hashFiles('openwrt/feeds.conf.default', 'openwrt/.config') }}
        restore-keys: |
          ${{ runner.os }}-openwrt-main-

    # ---------------------------------------------------------
    # 【步骤 5】加载自定义订阅源
    # ---------------------------------------------------------
    - name: 5. 执行 diy-part1.sh 脚本 (注入核心插件)
      run: |
        [ -e $FEEDS_CONF ] && cp $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    # ---------------------------------------------------------
    # 【步骤 6】更新并安装所有 Feeds 软件源依赖
    # ---------------------------------------------------------
    - name: 6. 运行 scripts/feeds 更新安装依赖
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    # ---------------------------------------------------------
    # 【步骤 7】加载自定义的精简配置与补丁
    # ---------------------------------------------------------
    - name: 7. 执行 diy-part2.sh 并加载 .config 配置
      run: |
        [ -e $CONFIG_FILE ] && cp $CONFIG_FILE openwrt/.config
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    # ---------------------------------------------------------
    # 【⚡ 加速优化：16线程拉取】多线程极限跑流，断流自动重试，拒绝单包卡死
    # ---------------------------------------------------------
    - name: 8. 预下载固件编译依赖包 (16线程极限并发)
      id: package
      run: |
        cd openwrt
        make defconfig
        make download -j16 V=s || make download -j16 V=s
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    # ---------------------------------------------------------
    # 【步骤 9】开始编译固件
    # ---------------------------------------------------------
    - name: 9. 开启多线程跑代码编译固件
      id: compile
      run: |
        cd openwrt
        echo -e "$(nproc) 线程并发编译中..."
        make -j$(nproc) || make -j1 || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT

    # ---------------------------------------------------------
    # 【步骤 10】整理固件输出文件
    # ---------------------------------------------------------
    - name: 10. 提取与提取打包好的编译产物 (精简过滤版)
      id: organize
      if: steps.compile.outputs.status == 'success' && !cancelled()
      run: |
        mkdir -p $GITHUB_WORKSPACE/firmware
        find openwrt/bin/targets/ -type f \( -name "*.img.gz" -o -name "*.vmdk" -o -name "*.qcow2" -o -name "*.manifest" \) -exec cp {} $GITHUB_WORKSPACE/firmware/ \;
        echo "FIRMWARE=$GITHUB_WORKSPACE/firmware" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    # ---------------------------------------------------------
    # 【步骤 11】将固件临时保存到 Artifacts
    # ---------------------------------------------------------
    - name: 11. 上传临时固件包到 Artifacts 存储
      uses: actions/upload-artifact@v4
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_Latest_${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    # ---------------------------------------------------------
    # 【步骤 12】发布固件到 GitHub Releases
    # ---------------------------------------------------------
    - name: 12. 正式打包发布固件至 GitHub Release 页面
      uses: softprops/action-gh-release@v2
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        tag_name: OpenWrt_Latest_${{ env.FILE_DATE }}
        name: OpenWrt 最新滚动开发版 毕业精简版 [${{ env.FILE_DATE }}]
        body: |
          ### 🚀 极致精简毕业版固件（2026 最新源码 APK 架构）
          - **核心源码**: OpenWrt Main 最新主分支（滚动更新）
          - **内置插件**: PassWall, OpenClash, UPnP, TurboACC
          - **语言支持**: 默认集成原生简体中文 (`zh_Hans`)
          - **主题皮肤**: 默认自带高颜值 Argon 主题 (适配 uCode 新版)
          - **区域定制**: 256MB 引导分区 + 2048MB(2GB) 根目录空间
        files: ${{ env.FIRMWARE }}/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # ---------------------------------------------------------
    # 【步骤 13】发送电报机器人编译结果通知
    # ---------------------------------------------------------
    - name: 13. 推送编译状态通知到你的 Telegram 机器人
      uses: appleboy/telegram-action@v1.0.0
      if: always()
      with:
        to: ${{ secrets.TELEGRAM_CHAT_ID }}
        token: ${{ secrets.TELEGRAM_TOKEN }}
        message: |
          报告主题：OpenWrt 最新版固件编译通知
          编译结果：${{ steps.compile.outputs.status == 'success' && '🎉 编译成功！' || '❌ 编译失败。' }}
          生成时间：${{ env.FILE_DATE || '未知时间' }}
          源码分支：OpenWrt 最新主分支 (${{ env.REPO_BRANCH }})
          点击下载：https://github.com/${{ github.repository }}/releases
