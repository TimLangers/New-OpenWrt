name: 编译 OpenWrt 最新版固件 (最优加速版)

on:
  workflow_dispatch:
  repository_dispatch:
  schedule:
    # 每天北京时间 00:00 开始编译 (对应 UTC 时间 16:00)
    - cron: '0 16 * * *'

env:
  REPO_URL: https://github.com/openwrt/openwrt
  REPO_BRANCH: main
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: 1️⃣ 拉取源码
      uses: actions/checkout@v4

    - name: 2️⃣ 环境准备与收集信息
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential clang flex bison gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file qemu-utils upx-ucl fastjar libelf-dev swig python3-setuptools python3-pyelftools zstd jq libcap-dev binutils-dev ccache
        sudo mkdir -p /workdir && sudo chown $USER:$USER /workdir
        echo "CPU_MODEL=$(cat /proc/cpuinfo | grep 'model name' | head -1 | cut -f2 -d: | sed 's/^[ \t]*//')" >> $GITHUB_ENV
        echo "CPU_CORES=$(nproc)" >> $GITHUB_ENV
        echo "FILE_DATE=$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_ENV

    - name: 3️⃣ 创建 Swap 分区
      run: |
        sudo swapoff -a || true
        sudo rm -f /swapfile
        sudo dd if=/dev/zero of=/swapfile bs=1M count=6144
        sudo chmod 600 /swapfile
        sudo mkswap /swapfile
        sudo swapon /swapfile

    - name: 4️⃣ 拦截并设置编译缓存 (最优提速核心)
      uses: actions/cache@v4
      with:
        path: |
          /workdir/openwrt/dl
          ~/.ccache
        key: ${{ runner.os }}-openwrt-cache-${{ hashFiles('**/feeds.conf.default', '**/.config') }}
        restore-keys: |
          ${{ runner.os }}-openwrt-cache-

    - name: 5️⃣ 源码下载与配置 (注入缓存配置)
      working-directory: /workdir
      run: |
        git clone --depth 1 -b $REPO_BRANCH $REPO_URL openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt
        cd openwrt
        
        mkdir -p ~/.ccache
        echo "max_size = 4G" > ~/.ccache/ccache.conf
        
        ./scripts/feeds update -a && ./scripts/feeds install -a
        [ -e $GITHUB_WORKSPACE/$CONFIG_FILE ] && cp $GITHUB_WORKSPACE/$CONFIG_FILE .config
        
        echo "CONFIG_CCACHE=y" >> .config
        echo "CONFIG_CCACHE_DIR=\"/home/runner/.ccache\"" >> .config
        make defconfig

    - name: 5️⃣ 发送【编译开始】通知
      run: |
        # 已完美恢复你最初的 TG 通知排版样式，并升级为稳定的 HTML 解析机制（防止下划线和特殊汉字崩掉）
        MSG="🚀 <b>OpenWrt 自动编译开始</b> 🕒 $(date '+%Y-%m-%d %H:%M:%S') 💻 CPU: AMD EPYC 7763 64-Core Processor (${{ env.CPU_CORES }}核) 📦 配置文件: .config 分支: ${{ env.REPO_BRANCH }} 🔗 <a href='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'>点击查看进度</a>"
        curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
          -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
          -d "text=${MSG}" \
          -d "parse_mode=HTML" || true

    - name: 6️⃣ 核心编译步骤 (智能容错机制)
      id: compile
      run: |
        cd /workdir/openwrt
        make tools/libtool/clean
        make download -j$(nproc)
        make tools/install -j1
        make toolchain/install -j1
        
        ccache -s
        
        if make -j$(nproc); then
          echo "status=success" >> $GITHUB_OUTPUT
        else
          echo "⚠️ 多线程编译失败，可能存在依赖冲突，正在自动降级到单线程 Debug 模式..."
          ccache -z
          if make -j1 V=s; then
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
            exit 1
          fi
        fi
        ccache -s

    - name: 7️⃣ 整理产物
      if: always()
      run: |
        mkdir -p $GITHUB_WORKSPACE/firmware
        if [ -d "/workdir/openwrt/bin/targets/" ]; then
          find /workdir/openwrt/bin/targets/ -type f \( -name "*.img.gz" -o -name "*.bin" \) -exec cp {} $GITHUB_WORKSPACE/firmware/ \;
          echo "FIRMWARE=$GITHUB_WORKSPACE/firmware" >> $GITHUB_ENV
        else
          echo "警告: 未检测到目标固件输出目录！"
        fi

    - name: 8️⃣ 发送【编译结果】通知
      if: always()
      run: |
        DEVICE="未知设备"
        if [ -f "/workdir/openwrt/.config" ]; then
          DEVICE=$(grep '^CONFIG_TARGET.*DEVICE.*=y' /workdir/openwrt/.config | sed -r 's/.*DEVICE_(.*)=y/\1/' || echo "通用设备")
        fi
        RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        
        if [ "${{ steps.compile.outputs.status }}" = "success" ]; then
          MSG="✅ <b>OpenWrt 自动编译成功！</b>%0A%0A📅 完成时间：$(date '+%Y-%m-%d %H:%M:%S')%0A📟 目标设备：${DEVICE}%0A🔗 <a href='https://github.com/${{ github.repository }}/releases/tag/OpenWrt_${{ env.FILE_DATE }}'>点击下载固件</a>%0A⚠️ <a href='${RUN_URL}'>详细日志</a>"
        else
          MSG="❌ <b>OpenWrt 自动编译失败！</b>%0A%0A📅 失败时间：$(date '+%Y-%m-%d %H:%M:%S')%0A📟 目标设备：${DEVICE}%0A⚠️ <a href='${RUN_URL}'>点击此处查看错误日志</a>"
        fi
        
        curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
          -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
          -d "text=${MSG}" \
          -d "parse_mode=HTML" || true

    - name: 9️⃣ 发布 Release
      if: steps.compile.outputs.status == 'success'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: OpenWrt_${{ env.FILE_DATE }}
        files: ${{ env.FIRMWARE }}/*
        body: |
          🚀 OpenWrt Main 分支自动编译成功！
          📅 编译时间: ${{ env.FILE_DATE }}
          📟 目标设备: ${{ env.DEVICE }}
          ⚡ 编译特性: 已开启全量 CCACHE 硬件级加速
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
