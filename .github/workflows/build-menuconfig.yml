name: 编译 OpenWrt 最新版固件

on:
  repository_dispatch:
  workflow_dispatch:
  schedule:
    - cron: '0 16 * * *'

env:
  REPO_URL: https://github.com/openwrt/openwrt
  REPO_BRANCH: main
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    # ---------------------------------------------------------
    # 1. 拉取当前仓库
    # ---------------------------------------------------------
    - name: 1. 拉取当前源码仓库
      uses: actions/checkout@v4

    # ---------------------------------------------------------
    # 2. 生成时间变量
    # ---------------------------------------------------------
    - name: 准备编译时间标记
      run: |
        echo "FILE_DATE=$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_ENV

    # ---------------------------------------------------------
    # 3. 清理磁盘并安装依赖
    # ---------------------------------------------------------
    - name: 2. 清理磁盘空间并安装 Linux 编译依赖
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/*
        # 彻底清理 30GB+ 无用开发组件，释放磁盘读写吞吐
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/share/swift
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file qemu-utils upx-ucl fastjar libelf-dev swig python3-setuptools python3-pyelftools zstd jq libssl-dev libcap-dev binutils-dev
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$USER /workdir

    # ---------------------------------------------------------
    # 4. 创建 6GB Swap 虚拟内存 (完美破除 Text file busy 核心逻辑)
    # ---------------------------------------------------------
    - name: 2.1 创建 6GB Swap 虚拟内存
      run: |
        echo "========= 智能检测并强制关闭已存在的旧 Swap ========="
        # 如果缓存中带有了旧的激活 swapfile，这里强行关闭它，防止 fallocate 报 Text file busy
        sudo swapoff -a || true
        sudo rm -f /swapfile || true

        echo "========= 开始划定并重新创建虚拟内存 Swap ========="
        sudo fallocate -l 6G /swapfile
        sudo chmod 600 /swapfile
        sudo mkswap /swapfile
        sudo swapon /swapfile

        echo "========= 当前虚拟内存分配状态 ========="
        free -h
        echo "========= Swap 物理挂载详情 ========="
        swapon --show

    # ---------------------------------------------------------
    # 5. 查看服务器硬件配置
    # ---------------------------------------------------------
    - name: 3. 收集编译服务器信息
      run: |
        echo "========= CPU 架构与型号 ========="
        cat /proc/cpuinfo | grep name | cut -f2 -d: | uniq
        echo "可用核心数: $(nproc)"
        echo "========= 运行内存总览 ========="
        free -h
        echo "========= 剩余磁盘吞吐空间 ========="
        df -h
        echo "========= 编译节点网络出口环境 ========="
        curl -s https://ipinfo.io/json || true

    # ---------------------------------------------------------
    # 6. 拉取 OpenWrt
    # ---------------------------------------------------------
    - name: 4. 拉取 OpenWrt 主线源码
      working-directory: /workdir
      run: |
        git clone --depth 1 -b $REPO_BRANCH $REPO_URL openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    # ---------------------------------------------------------
    # 7. GitHub Cache 智能全局缓存 (15分钟速通的核心)
    # ---------------------------------------------------------
    - name: ⚡ 启用编译缓存机制 (Actions Cache)
      uses: actions/cache@v4
      with:
        path: |
          openwrt/dl
          openwrt/staging_dir/host
          openwrt/build_dir/host
        key: ${{ runner.os }}-openwrt-main-${{ hashFiles('openwrt/feeds.conf.default', 'openwrt/.config') }}
        restore-keys: |
          ${{ runner.os }}-openwrt-main-

    # ---------------------------------------------------------
    # 8. 自定义 feeds
    # ---------------------------------------------------------
    - name: 5. 执行 diy-part1.sh
      run: |
        [ -e $FEEDS_CONF ] && cp $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    # ---------------------------------------------------------
    # 9. 更新 feeds
    # ---------------------------------------------------------
    - name: 6. 更新并安装 Feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    # ---------------------------------------------------------
    # 10. 加载配置
    # ---------------------------------------------------------
    - name: 7. 执行 diy-part2.sh 并加载配置
      run: |
        [ -e $CONFIG_FILE ] && cp $CONFIG_FILE openwrt/.config
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    # ---------------------------------------------------------
    # 11. 下载依赖
    # ---------------------------------------------------------
    - name: 8. 下载编译依赖
      id: package
      run: |
        cd openwrt
        make defconfig
        make download -j16 V=s || make download -j16 V=s
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    # ---------------------------------------------------------
    # 12. 编译固件 (智能两阶段：首发全核暴击，翻车自动单线程 V=s 打印)
    # ---------------------------------------------------------
    - name: 9. 开始稳定编译固件
      id: compile
      run: |
        cd openwrt
        echo "优先启动多线程极速编译。如遭遇突发报错，将自动原地降级单线程（make -j1 V=s）抓取核心错误日志。"
        make -j$(nproc) || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT

    # ---------------------------------------------------------
    # 13. 整理固件
    # ---------------------------------------------------------
    - name: 10. 整理编译产物
      id: organize
      if: steps.compile.outputs.status == 'success' && !cancelled()
      run: |
        mkdir -p $GITHUB_WORKSPACE/firmware
        find openwrt/bin/targets/ -type f \( -name "*.img.gz" -o -name "*.vmdk" -o -name "*.qcow2" -o -name "*.manifest" \) -exec cp {} $GITHUB_WORKSPACE/firmware/ \;
        echo "FIRMWARE=$GITHUB_WORKSPACE/firmware" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    # ---------------------------------------------------------
    # 14. 上传 Artifact
    # ---------------------------------------------------------
    - name: 11. 上传临时固件
      uses: actions/upload-artifact@v4
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_Latest_${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    # ---------------------------------------------------------
    # 15. 发布 Release
    # ---------------------------------------------------------
    - name: 12. 发布 GitHub Release
      uses: softprops/action-gh-release@v2
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        tag_name: OpenWrt_Latest_${{ env.FILE_DATE }}
        name: OpenWrt 最新滚动开发版 [${{ env.FILE_DATE }}]
        body: |
          ### 🚀 OpenWrt Main 最新精简毕业版
          - **核心源码**：OpenWrt Main 最新主线（滚动更新，适配最新 APK 架构）
          - **科学增强**：集成 PassWall / OpenClash 核心插件
          - **网络加速**：内置 UPnP 与 TurboACC 网络加速
          - **高颜值皮**：默认 Argon 适配新版 uCode 主题
          - **原生集成**：简体中文 (`zh_Hans`) 原生注入
        files: ${{ env.FIRMWARE }}/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # ---------------------------------------------------------
    # 16. Telegram 通知
    # ---------------------------------------------------------
    - name: 13. Telegram 编译通知
      uses: appleboy/telegram-action@v1.0.0
      if: always()
      with:
        to: ${{ secrets.TELEGRAM_CHAT_ID }}
        token: ${{ secrets.TELEGRAM_TOKEN }}
        message: |
          OpenWrt 编译通知
          
          编译结果：${{ steps.compile.outputs.status == 'success' && '🎉 编译成功' || '❌ 编译失败' }}
          编译时间：${{ env.FILE_DATE }}
          源码分支：${{ env.REPO_BRANCH }}
          固件下载：https://github.com/${{ github.repository }}/releases
